<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Exoplanet Review{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141b2d;
      --border: #24304a;
      --text: #e8eefc;
      --muted: #93a4c7;
      --accent: #6ea8fe;
      --ok: #3ddc97;
      --warn: #ffcc66;
      --bad: #ff7b7b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, #0a0f1c, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 15, 28, 0.9);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    header p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tabs a, .tabs button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tabs a.active { border-color: var(--accent); color: var(--accent); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
    }
    .card h2, .card h3 { margin: 0 0 0.5rem; font-size: 1rem; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.pending { background: rgba(255,204,102,0.15); color: var(--warn); }
    .badge.approved { background: rgba(61,220,151,0.15); color: var(--ok); }
    .badge.rejected { background: rgba(255,123,123,0.15); color: var(--bad); }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    button, .btn {
      border: 1px solid var(--border);
      background: #1a2440;
      color: var(--text);
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button.primary { background: #2456a6; border-color: #3d6ec4; }
    button.approve { background: rgba(61,220,151,0.15); border-color: var(--ok); color: var(--ok); }
    button.reject { background: rgba(255,123,123,0.12); border-color: var(--bad); color: var(--bad); }
    pre, .summary {
      white-space: pre-wrap;
      background: #0f1628;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    textarea, input[type=text] {
      width: 100%;
      background: #0f1628;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font: inherit;
    }
    .comments { margin-top: 1rem; }
    .comment {
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin: 0.65rem 0;
    }
    .flash {
      background: rgba(110,168,254,0.12);
      border: 1px solid rgba(110,168,254,0.35);
      color: var(--accent);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Exoplanet Candidate Review</h1>
    <p>Human-in-the-loop vetting for flagged TESS / Kepler light-curve signals</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
