[project]
name = "research-platform"
version = "0.1.0"
description = "Multi-tenant OpenClaw + Telegram research platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "rq>=2.0.0",
    "python-telegram-bot>=21.7",
    "apscheduler>=3.10.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0.2",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "astropy>=6.0.0",
    "psycopg2-binary>=2.9.10",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_platform*", "projects*"]

[tool.setuptools.package-data]
research_platform = ["templates/**/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
