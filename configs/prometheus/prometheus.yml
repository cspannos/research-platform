global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: ["platform-api:8000"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
